name: Export Notes to PDF

on:
  workflow_dispatch:
    inputs:
      sort_order:
        description: 'Sort order for the PDF'
        required: true
        default: 'topic'
        type: choice
        options:
          - 'topic'
          - 'chronological'
      theme:
        description: 'PDF Theme'
        required: true
        default: 'light'
        type: choice
        options:
          - 'light'
          - 'dark'

permissions:
  contents: write

jobs:
  export-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install marked puppeteer

      - name: Generate PDF compilation script
        run: |
          cat << 'EOF' > generate-pdf.js
          const fs = require('fs');
          const path = require('path');
          const { marked } = require('marked');
          const puppeteer = require('puppeteer');

          function getFilesRec(dir, fileList = []) {
            const files = fs.readdirSync(dir);
            files.forEach(file => {
              const filePath = path.join(dir, file);
              if (fs.statSync(filePath).isDirectory()) {
                getFilesRec(filePath, fileList);
              } else if (file.endsWith('.md')) {
                fileList.push(filePath);
              }
            });
            return fileList;
          }

          function parseFrontMatter(content) {
            const fmRegex = /^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/;
            const match = content.match(fmRegex);
            if (!match) return { meta: {}, body: content };

            const metaLines = match[1].split('\n');
            const meta = {};
            metaLines.forEach(line => {
              const parts = line.split(':');
              if (parts.length >= 2) {
                const key = parts[0].trim();
                let value = parts.slice(1).join(':').trim();
                // strip quotes
                if (value.startsWith('"') && value.endsWith('"')) {
                  value = value.substring(1, value.length - 1);
                }
                if (value.startsWith('[') && value.endsWith(']')) {
                  value = value.substring(1, value.length - 1).split(',').map(s => s.trim());
                }
                meta[key] = value;
              }
            });
            return { meta, body: match[2] };
          }

          async function run() {
            const problemsDir = path.join(process.cwd(), 'problems');
            if (!fs.existsSync(problemsDir)) {
              console.log("No problems directory found. Exiting.");
              process.exit(0);
            }

            const files = getFilesRec(problemsDir);
            const notes = [];

            files.forEach(file => {
              const content = fs.readFileSync(file, 'utf8');
              const { meta, body } = parseFrontMatter(content);
              
              // Guess tag folder if not defined
              const relativePath = path.relative(problemsDir, file);
              const folderTag = relativePath.split(path.sep)[0];
              
              notes.push({
                file,
                meta: {
                  title: meta.title || path.basename(file, '.md'),
                  difficulty: meta.difficulty || 'Unknown',
                  tags: meta.tags || [folderTag],
                  language: meta.language || 'Unknown',
                  solved_at: meta.solved_at || new Date().toISOString(),
                  leetcode_url: meta.leetcode_url || '',
                  ...meta
                },
                body,
                folderTag
              });
            });

            // Sorting logic
            const sortOrder = process.env.SORT_ORDER || 'topic';
            if (sortOrder === 'chronological') {
              notes.sort((a, b) => new Date(a.meta.solved_at) - new Date(b.meta.solved_at));
            } else {
              // Alphabetical by topic/folder, then by problem title
              notes.sort((a, b) => {
                const tagCompare = a.folderTag.localeCompare(b.folderTag);
                if (tagCompare !== 0) return tagCompare;
                return a.meta.title.localeCompare(b.meta.title);
              });
            }

            // Theme choice
            const theme = process.env.THEME || 'light';
            const isDark = theme === 'dark';

            let htmlContent = `
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="utf-8">
              <style>
                @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
                
                body {
                  font-family: 'Inter', -apple-system, sans-serif;
                  line-height: 1.6;
                  font-size: 14px;
                  color: ${isDark ? '#e4e4e7' : '#18181b'};
                  background-color: ${isDark ? '#09090b' : '#ffffff'};
                  margin: 0;
                  padding: 2cm;
                }
                
                h1, h2, h3 {
                  color: ${isDark ? '#ffffff' : '#000000'};
                  font-weight: 700;
                  letter-spacing: -0.02em;
                }
                
                h1 {
                  font-size: 28px;
                  border-bottom: 1px solid ${isDark ? '#27272a' : '#e4e4e7'};
                  padding-bottom: 8px;
                  margin-top: 0;
                }
                
                h2 {
                  font-size: 18px;
                  margin-top: 24px;
                  margin-bottom: 8px;
                  font-weight: 600;
                  border-bottom: 1px solid ${isDark ? '#1f1f23' : '#f4f4f5'};
                  padding-bottom: 4px;
                }

                .page-break {
                  page-break-before: always;
                }

                .toc-page {
                  page-break-after: always;
                  display: flex;
                  flex-direction: column;
                  min-height: 100%;
                }

                .title-page {
                  page-break-after: always;
                  display: flex;
                  flex-direction: column;
                  justify-content: center;
                  align-items: center;
                  height: 100vh;
                  text-align: center;
                }

                .title-page h1 {
                  border: none;
                  font-size: 42px;
                  margin-bottom: 10px;
                }

                .title-page p {
                  color: ${isDark ? '#a1a1aa' : '#71717a'};
                  font-size: 16px;
                }

                .metadata-grid {
                  display: grid;
                  grid-template-columns: auto 1fr;
                  gap: 8px 16px;
                  margin: 16px 0;
                  font-size: 13px;
                  background: ${isDark ? '#18181b' : '#f4f4f5'};
                  padding: 12px 16px;
                  border-radius: 6px;
                  border: 1px solid ${isDark ? '#27272a' : '#e4e4e7'};
                }

                .metadata-label {
                  font-weight: 600;
                  color: ${isDark ? '#a1a1aa' : '#71717a'};
                }

                .metadata-value {
                  color: ${isDark ? '#f4f4f5' : '#18181b'};
                }

                .pill {
                  display: inline-block;
                  padding: 2px 8px;
                  border-radius: 4px;
                  font-size: 11px;
                  font-weight: 600;
                  text-transform: uppercase;
                  letter-spacing: 0.03em;
                }

                .pill.Easy { background-color: rgba(52, 211, 153, 0.15); color: #10b981; }
                .pill.Medium { background-color: rgba(251, 191, 36, 0.15); color: #f59e0b; }
                .pill.Hard { background-color: rgba(248, 113, 113, 0.15); color: #ef4444; }

                pre {
                  background: ${isDark ? '#18181b' : '#f4f4f5'};
                  border: 1px solid ${isDark ? '#27272a' : '#e4e4e7'};
                  padding: 16px;
                  border-radius: 6px;
                  overflow-x: auto;
                  font-family: 'JetBrains Mono', monospace;
                  font-size: 12.5px;
                  line-height: 1.5;
                  color: ${isDark ? '#e4e4e7' : '#18181b'};
                }

                code {
                  font-family: 'JetBrains Mono', monospace;
                  font-size: 12px;
                  background: ${isDark ? '#27272a' : '#f4f4f5'};
                  padding: 2px 4px;
                  border-radius: 3px;
                }

                pre code {
                  padding: 0;
                  background: transparent;
                  font-size: inherit;
                }

                .toc-list {
                  list-style: none;
                  padding: 0;
                  margin: 20px 0;
                }

                .toc-item {
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  padding: 6px 0;
                  border-bottom: 1px dashed ${isDark ? '#27272a' : '#e4e4e7'};
                }

                .toc-name {
                  font-weight: 500;
                }

                .toc-tag {
                  font-size: 11px;
                  color: ${isDark ? '#71717a' : '#a1a1aa'};
                }
              </style>
            </head>
            <body>
              <div class="title-page">
                <h1>LeetCode Solving Notes</h1>
                <p>Generated on ${new Date().toLocaleDateString()} &bull; Total Problems: ${notes.length}</p>
              </div>

              <div class="toc-page">
                <h1>Table of Contents</h1>
                <ul class="toc-list">
                  ${notes.map(n => `
                    <li class="toc-item">
                      <span class="toc-name">${n.meta.title}</span>
                      <span class="toc-tag">${n.folderTag.toUpperCase()} &bull; <span class="pill ${n.meta.difficulty}">${n.meta.difficulty}</span></span>
                    </li>
                  `).join('')}
                </ul>
              </div>

              ${notes.map((n, index) => `
                <div class="${index > 0 ? 'page-break' : ''}">
                  <h1>${n.meta.title}</h1>
                  
                  <div class="metadata-grid">
                    <span class="metadata-label">Difficulty</span>
                    <span class="metadata-value"><span class="pill ${n.meta.difficulty}">${n.meta.difficulty}</span></span>
                    
                    <span class="metadata-label">Topics</span>
                    <span class="metadata-value">${n.meta.tags.join(', ')}</span>
                    
                    <span class="metadata-label">Language</span>
                    <span class="metadata-value">${n.meta.language}</span>
                    
                    <span class="metadata-label">Solved At</span>
                    <span class="metadata-value">${new Date(n.meta.solved_at).toLocaleDateString()}</span>
                    
                    ${n.meta.leetcode_url ? `
                      <span class="metadata-label">Problem URL</span>
                      <span class="metadata-value"><a href="${n.meta.leetcode_url}" style="color: #ff6b00; text-decoration: none;">${n.meta.leetcode_url}</a></span>
                    ` : ''}
                  </div>

                  ${marked.parse(n.body)}
                </div>
              `).join('')}
            </body>
            </html>
            `;

            fs.writeFileSync('temp.html', htmlContent);

            console.log("Launching Puppeteer...");
            const browser = await puppeteer.launch({
              headless: "new",
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            
            // Set content and wait for images/fonts
            await page.setContent(htmlContent, { waitUntil: 'networkidle0' });

            const exportsDir = path.join(process.cwd(), 'exports');
            if (!fs.existsSync(exportsDir)) {
              fs.mkdirSync(exportsDir);
            }

            const pdfPath = path.join(exportsDir, 'leetcode-notes.pdf');
            console.log("Generating PDF to:", pdfPath);
            await page.pdf({
              path: pdfPath,
              format: 'A4',
              printBackground: true,
              margin: {
                top: '0px',
                bottom: '0px',
                left: '0px',
                right: '0px'
              }
            });

            await browser.close();
            fs.unlinkSync('temp.html');
            console.log("PDF generation complete!");
          }

          run().catch(console.error);
          EOF

      - name: Build PDF
        env:
          SORT_ORDER: ${{ github.event.inputs.sort_order }}
          THEME: ${{ github.event.inputs.theme }}
        run: node generate-pdf.js

      - name: Clean up generation script
        run: rm generate-pdf.js

      - name: Commit PDF back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/leetcode-notes.pdf
          git diff-index --quiet HEAD || git commit -m "docs: export compilation pdf [skip ci]"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed or no changes to commit"

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: leetcode-notes-pdf
          path: exports/leetcode-notes.pdf
